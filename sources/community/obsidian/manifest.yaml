name: obsidian
version: 0.1.0
dsl_version: 3
backend: http
description: "Query notes, searches, tags, and commands from the Obsidian Local REST API (self-hosted)."
base_url: "{{input.OBSIDIAN_BASE_URL}}"
auth:
  type: HeaderAuth
  headers:
    - name: Authorization
      from: template
      template: "Bearer {{input.OBSIDIAN_API_KEY}}"
inputs:
  OBSIDIAN_BASE_URL:
    kind: variable
    default: "https://127.0.0.1:27124"
    hint: |
      Base URL for the Obsidian Local REST API.
      Use https://127.0.0.1:27124 for HTTPS or http://127.0.0.1:27123 for HTTP.
      If HTTPS fails due to the self-signed certificate, switch to the HTTP URL.
  OBSIDIAN_API_KEY:
    kind: secret
    hint: |
      API key for the Obsidian Local REST API plugin.
      Find it in Obsidian Settings → Local REST API after enabling the plugin.
      This key grants full access to your vault; use a dedicated vault if needed.
      Docs: https://coddingtonbear.github.io/obsidian-local-rest-api/
tables:
  - name: commands
    description: "Available Obsidian command palette actions."
    request:
      method: GET
      path: /commands/
    response:
      rows_path:
        - commands
    columns:
      - name: id
        type: Utf8
        nullable: true
        description: Command identifier
        expr:
          kind: path
          path:
            - id
      - name: name
        type: Utf8
        nullable: true
        description: Command display name
        expr:
          kind: path
          path:
            - name
  - name: tags
    description: "Tags across the vault with usage counts."
    request:
      method: GET
      path: /tags/
    response:
      rows_path:
        - tags
    columns:
      - name: tag
        type: Utf8
        nullable: true
        description: Tag value
        expr:
          kind: path
          path:
            - tag
      - name: count
        type: Int64
        nullable: true
        description: Number of notes with the tag
        expr:
          kind: path
          path:
            - count
  - name: search_simple
    description: "Fuzzy search results from the vault."
    guide: |
      Provide a query string using the query filter.
    filters:
      - name: query
        description: Full-text query string for Obsidian search.
    request:
      method: POST
      path: /search/simple/
      query:
        - name: query
          from: filter
          key: query
    response:
      rows_path: []
    columns:
      - name: filename
        type: Utf8
        nullable: true
        description: Matching note filename
        expr:
          kind: path
          path:
            - filename
      - name: score
        type: Float64
        nullable: true
        description: Match score
        expr:
          kind: path
          path:
            - score
      - name: query
        type: Utf8
        virtual: true
        description: Search query filter.
        expr:
          kind: from_filter
          key: query
  - name: vault_files
    description: "Files and folders at the vault root."
    request:
      method: GET
      path: /vault/
    response:
      rows_path:
        - files
    columns:
      - name: name
        type: Utf8
        nullable: true
        description: File or folder name
        expr:
          kind: current_row
functions:
  - name: read_note
    description: "Read a note as structured JSON including content, tags, and frontmatter."
    args:
      - name: path
        required: true
        bind:
          arg: path
    request:
      method: GET
      path: /vault/{{arg.path}}
      headers:
        - name: Accept
          from: literal
          value: application/vnd.olrapi.note+json
    response:
      rows_path: []
    columns:
      - name: path
        type: Utf8
        nullable: true
        description: Note path
        expr:
          kind: path
          path:
            - path
      - name: content
        type: Utf8
        nullable: true
        description: Note content
        expr:
          kind: path
          path:
            - content
      - name: tags
        type: Utf8
        nullable: true
        description: Tags found in the note
        expr:
          kind: path
          path:
            - tags
      - name: frontmatter
        type: Utf8
        nullable: true
        description: Frontmatter properties as JSON
        expr:
          kind: path
          path:
            - frontmatter
  - name: list_directory
    description: "List files and folders in a vault directory."
    args:
      - name: path
        required: false
        bind:
          arg: path
    request:
      method: GET
      path: /vault/{{arg.path}}/
    response:
      rows_path:
        - files
    columns:
      - name: name
        type: Utf8
        nullable: true
        description: File or folder name
        expr:
          kind: current_row
test_queries:
  - "SELECT id, name FROM obsidian.commands LIMIT 1"
  - "SELECT tag, count FROM obsidian.tags LIMIT 1"
  - "SELECT name FROM obsidian.vault_files LIMIT 1"
  - "SELECT filename, score FROM obsidian.search_simple WHERE query = 'test'"
